name: Deploy Railway Sites

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: neuro-sleep-site
            url: https://neuro-sleep-site-production.up.railway.app
          - service: manifest-signal-site
            url: https://manifest-signal-site-production.up.railway.app
          - service: ai-hustle-site
            url: https://ai-hustle-site-production.up.railway.app
          - service: metabolic-reset-site
            url: https://metabolic-reset-site-production.up.railway.app
          - service: love-psychology-site
            url: https://love-psychology-site-production.up.railway.app
    steps:
      - uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy site service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --project a9895cce-1c0f-4055-9e39-1f381cf37051 --environment production --service ${{ matrix.service }} --detach

      - name: Wait for healthy Railway deployment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link --project a9895cce-1c0f-4055-9e39-1f381cf37051 --environment production --service ${{ matrix.service }} --json
          sleep 5
          for attempt in $(seq 1 30); do
            STATUS=$(railway deployment list --service ${{ matrix.service }} --environment production --limit 1 --json | jq -r '.[0].status')
            echo "Attempt $attempt: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              curl --fail --location --silent --show-error --output /dev/null --max-time 20 "${{ matrix.url }}/"
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              railway logs --service ${{ matrix.service }} --lines 100
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for ${{ matrix.service }}"
          exit 1
