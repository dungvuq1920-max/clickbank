name: Deploy to Railway

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token $RAILWAY_TOKEN
          railway up --service clickbank --environment production --detach
          echo "Deployment started on Railway"

      - name: Verify deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token $RAILWAY_TOKEN
          sleep 30
          HEALTH=$(curl -s -w "%{http_code}" -o /dev/null https://clickbank-production.up.railway.app/)
          if [ $HEALTH -eq 307 ] || [ $HEALTH -eq 200 ]; then
            echo "✅ Deployment verified - App is live!"
          else
            echo "❌ Health check failed with code $HEALTH"
            exit 1
          fi
