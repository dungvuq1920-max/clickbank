name: Deploy Railway Sites

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - neuro-sleep-site
          - manifest-signal-site
          - ai-hustle-site
          - metabolic-reset-site
          - love-psychology-site
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy site service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project a9895cce-1c0f-4055-9e39-1f381cf37051 --environment production --service ${{ matrix.service }} --detach
